# Settings come only from the environment contract (spec 01 §4). The local target parses
# DBT_WAREHOUSE_DSN (postgresql://user:password@host:port/db; Terraform passwords are alphanumeric).
clickstream:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: postgres
      user: "{{ env_var('DBT_WAREHOUSE_DSN').split('://')[1].rsplit('@', 1)[0].split(':', 1)[0] }}"
      password: "{{ env_var('DBT_WAREHOUSE_DSN').split('://')[1].rsplit('@', 1)[0].split(':', 1)[1] }}"
      host: "{{ env_var('DBT_WAREHOUSE_DSN').rsplit('@', 1)[1].split('/', 1)[0].rsplit(':', 1)[0] }}"
      port: "{{ env_var('DBT_WAREHOUSE_DSN').rsplit('@', 1)[1].split('/', 1)[0].rsplit(':', 1)[1] | as_number }}"
      dbname: "{{ env_var('DBT_WAREHOUSE_DSN').rsplit('/', 1)[1].split('?', 1)[0] }}"
      schema: staging
      threads: 4
      connect_timeout: 10
