version: 2

sources:
  - name: raw
    schema: "{{ env_var('WAREHOUSE_RAW_SCHEMA', 'raw') }}"
    description: Raw clickstream events written by the ingest consumer (D11).
    tables:
      - name: clickstream_events
        loaded_at_field: ingested_at
        config:
          freshness:
            error_after: {count: "{{ env_var('RAW_FRESHNESS_MINUTES', '30') | as_number }}", period: minute}
