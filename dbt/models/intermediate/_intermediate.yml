version: 2

models:
  - name: int_sessions
    description: >
      One row per event with its derived session (spec 06 §5.2): a new session starts after 30 minutes
      of inactivity per user_id. client_session_id is the client's tab-level session_id, kept for
      comparison. Incremental runs recompute every event of each user with new events.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests: [not_null]
      - name: session_key
        description: dbt_utils.generate_surrogate_key(user_id, session_seq).
        data_tests: [not_null]
      - name: session_seq
        data_tests: [not_null]

  - name: int_cart_lines
    description: >
      One row per (cart, product) with the line's final state (spec 06 §5.2): units added after the line's
      last remove and the latest unit price. is_removed is true when the last action was a remove
      (quantity 0). Incremental runs recompute every line of each cart with new events.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cart_id, product_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "quantity >= 0"
    columns:
      - name: cart_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: user_id
        data_tests: [not_null]
