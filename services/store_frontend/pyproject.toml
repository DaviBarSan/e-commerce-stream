[project]
name = "store-frontend"
version = "0.1.0"
description = "Store frontend (Reflex): the storefront UI on :3000 (spec 02)"
requires-python = ">=3.12"
dependencies = [
    "reflex~=0.9.12",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["store_frontend"]
