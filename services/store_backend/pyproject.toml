[project]
name = "store-backend"
version = "0.1.0"
description = "Store API (FastAPI) with clickstream telemetry (spec 02)"
requires-python = ">=3.12"
dependencies = [
    "clickstream[kafka]",
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
clickstream = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["store_backend"]
