[project]
name = "ingest-consumer"
version = "0.1.0"
description = "Ingest consumer: Kafka to the raw warehouse table, with a DLQ (spec 05)"
requires-python = ">=3.12"
dependencies = [
    "clickstream[kafka]",
    "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
clickstream = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest_consumer"]
