[project]
name = "clickstream"
version = "0.1.0"
description = "Cloud-agnostic clickstream analytics pipeline"
# Keep in line with PYTHON_MIN_VERSION in versions.env.
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format-nongpl]>=4.26",
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telemetry"]

[dependency-groups]
dev = [
    "confluent-kafka>=2.15.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared helpers live in tests/e2e/e2e_support.py; importlib mode lets feature folders reuse file names.
pythonpath = ["tests/e2e"]
addopts = "--import-mode=importlib"
